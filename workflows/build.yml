name: Build UEFI Loader

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential gcc-mingw-w64 gnu-efi

    - name: Build loader
      run: make

    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: uefi-loader
        path: loader.efi
