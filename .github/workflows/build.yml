name: Build UEFI Loader

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential uuid-dev iasl git python3

      - name: Setup EDK II Workspace and Build
        run: |
          # 1. 完整複製 edk2 與所有巢狀子模組
          git clone --recurse-submodules --depth 1 https://github.com/tianocore/edk2.git edk2
          cd edk2

          # 2. 將倉庫中的 loader 與 dsc 複製到 edk2 目錄中
          mkdir -p loader
          cp -r $GITHUB_WORKSPACE/loader/* loader/
          cp $GITHUB_WORKSPACE/XboxPkg.dsc ./

          # 3. 編譯 BaseTools 並初始化環境
          make -C BaseTools
          export EDK_TOOLS_PATH=$PWD/BaseTools
          . edksetup.sh

          # 4. 強制指定 GCC5 的工具鏈前綴指向系統預設的 gcc/g++
          export GCC5_X64_PREFIX=gcc

          # 5. 開始編譯 UEFI 應用程式
          build -p XboxPkg.dsc -a X64 -t GCC5 -b RELEASE

      - name: Package with Timestamp
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BUILD_DIR="edk2/Build/XboxPkg/RELEASE_GCC5/X64"
          
          mkdir -p output
          
          # 複製標準命名與帶時間戳記的檔案
          cp "$BUILD_DIR/loader.efi" "output/loader.efi"
          cp "$BUILD_DIR/loader.efi" "output/loader-$TIMESTAMP.efi"
          
          echo "Generated loader-$TIMESTAMP.efi successfully."

      - name: Upload EFI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UEFI-Loader-${{ github.sha }}
          path: output/
