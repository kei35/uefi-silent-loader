name: Build UEFI Loader with Timestamp

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate Timestamp Version
        id: vars
        run: |
          # 取得台灣時間 (UTC+8) 的 YYYY.MMDD.HHMM 格式
          VERSION_TAG=$(TZ='Asia/Taipei' date +'%Y.%m%d.%H%M')
          echo "version=$VERSION_TAG" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION_TAG"

      - name: Install GNU-EFI Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gnu-efi binutils

      - name: Compile EFI Binaries with Version
        run: |
          # 執行 make，將會同時編譯 main.c 與 main-QUIET.c
          make VERSION="${{ steps.vars.outputs.version }}"

      - name: Prepare Artifacts Directory
        run: |
          # 建立 dist 資料夾，並將雙版本加上時間戳記重新命名
          mkdir -p dist
          cp loader-debug.efi dist/loader-debug_${{ steps.vars.outputs.version }}.efi
          cp loader-quiet.efi dist/loader-quiet_${{ steps.vars.outputs.version }}.efi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: uefi-loader-${{ steps.vars.outputs.version }}
          path: dist/
